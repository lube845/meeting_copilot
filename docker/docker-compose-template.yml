services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-meeting_copilot_root_2024}
      MYSQL_USER: ${DB_USER:-meeting_copilot_admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-meeting_copilot_secure_2024}
      MYSQL_DATABASE: ${DB_NAME:-meeting_copilot_db}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    networks:
      - meeting_copilot_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-meeting_copilot_root_2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # 后端API服务
  meeting_copilot_backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    env_file:
      - .env
    working_dir: /workspace
    ports:
      - "${BACKEND_EXTERNAL_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - meeting_copilot_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # ASR 服务由外部提供，通过 .env 中的 ASR_API_URL 配置
    command: sh -c "python -c 'import asyncio; from backend.core.database import init_db; asyncio.run(init_db())' && python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000"

  # MinIO对象存储
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${OSS_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${OSS_SECRET_KEY:-minio_secure_2024}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - meeting_copilot_network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # 前端服务 (生产模式)
  meeting_copilot_frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-8888}:80"
    networks:
      - meeting_copilot_network
    depends_on:
      meeting_copilot_backend:
        condition: service_healthy

volumes:
  mysql_data:
  minio_data:

networks:
  meeting_copilot_network:
    driver: bridge