# Nginx 主配置（覆盖官方镜像的 /etc/nginx/nginx.conf）
#
# 与官方 nginx:alpine 主配置的唯一差异：pid 与各类临时目录从
# /run、/var/cache/nginx 挪到 /tmp。
#
# 原因：本镜像以非 root 用户（nginx, uid 101）运行，而
#   - /run、/var/cache/nginx 在镜像里都是 root 属主
#   - /run 在部分运行环境下是 tmpfs，构建期预置的文件会在启动时消失
# /tmp 是 1777（sticky），任意用户可写可删，不依赖镜像层的目录属主。
#
# 注意：以非 root 运行时 nginx 会打印一条
#   [warn] the "user" directive makes sense only if the master process runs with super-user privileges, ignored
# 属预期噪音（worker 本来就以 nginx 用户运行）。

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
